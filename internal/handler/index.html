<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finance MCP</title>
<style>
:root {
  color-scheme: dark light;
  --background: #0f172a;
  --card: #1b2336;
  --foreground: #f8fafc;
  --muted: #94a3b8;
  --border: #475569;
  --accent: #22c55e;
  --on-accent: #0f172a;
  --error: #f87171;
  --link: #86efac;
  --ring: #ffffff;
}

@media (prefers-color-scheme: light) {
  :root {
    --background: #f8fafc;
    --card: #ffffff;
    --foreground: #0f172a;
    --muted: #475569;
    --border: #64748b;
    --error: #b91c1c;
    --link: #166534;
    --ring: #0f172a;
  }
}

* { box-sizing: border-box; }

[hidden] { display: none; }

body {
  margin: 0;
  padding: 48px 16px;
  background: var(--background);
  color: var(--foreground);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

main {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 24px;
  max-width: 640px;
  margin: 0 auto;
}

h1 {
  margin: 0;
  font-size: 28px;
  line-height: 1.2;
}

header p, .hint {
  margin: 4px 0 0;
  color: var(--muted);
}

.hint, .error { font-size: 14px; }

code, ol, pre, input {
  font-family: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
}

form, section {
  padding: 24px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
}

form {
  display: grid;
  gap: 20px;
}

label {
  display: block;
  margin-bottom: 6px;
  font-weight: 600;
}

input {
  width: 100%;
  min-height: 44px;
  padding: 8px 12px;
  background: var(--background);
  color: var(--foreground);
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 16px;
}

input[aria-invalid="true"] { border-color: var(--error); }

input:focus-visible, button:focus-visible, a:focus-visible, summary:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 8px 20px;
  background: var(--accent);
  color: var(--on-accent);
  border: 0;
  border-radius: 6px;
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 200ms;
}

button:hover { opacity: 0.85; }

button:disabled {
  opacity: 0.7;
  cursor: wait;
}

button:disabled::before {
  content: "";
  width: 16px;
  height: 16px;
  border: 2px solid currentColor;
  border-right-color: transparent;
  border-radius: 50%;
  animation: spin 800ms linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@media (prefers-reduced-motion: reduce) {
  button { transition: none; }
  button:disabled::before { animation: none; }
}

.error {
  margin: 6px 0 0;
  color: var(--error);
}

#status {
  margin: 0;
  font-weight: 600;
}

#status.failed { color: var(--error); }

ol {
  display: grid;
  gap: 8px;
  margin: 16px 0 0;
  padding-left: 32px;
  font-size: 14px;
  overflow-wrap: anywhere;
}

ol:empty { display: none; }

li::marker { color: var(--muted); }

a {
  color: var(--link);
  text-underline-offset: 2px;
}

details { margin-top: 16px; }

summary {
  padding: 4px 0;
  color: var(--muted);
  cursor: pointer;
}

pre {
  max-height: 320px;
  margin: 8px 0 0;
  padding: 12px;
  overflow: auto;
  background: var(--background);
  border-radius: 6px;
  font-size: 14px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
</style>
</head>
<body>
<main>
  <header>
    <h1>Finance MCP</h1>
    <p>Test the <code>scrape_links</code> tool.</p>
  </header>

  <form id="form">
    <div>
      <label for="token">Token</label>
      <input id="token" type="password" autocomplete="off" aria-describedby="token-error" required>
      <p id="token-error" class="error" hidden>This token was rejected. Check your MCP_TOKEN value.</p>
    </div>
    <div>
      <label for="url">Page URL</label>
      <input id="url" type="url" placeholder="https://www.example.com/investors" required>
    </div>
    <div>
      <label for="waitFor">Wait for</label>
      <input id="waitFor" aria-describedby="wait-hint">
      <p id="wait-hint" class="hint">Optional CSS selector, for links loaded by JavaScript.</p>
    </div>
    <div><button id="submit">Scrape</button></div>
  </form>

  <section id="result" aria-live="polite" hidden>
    <p id="status" role="status"></p>
    <ol id="links"></ol>
    <details id="details" hidden>
      <summary>Raw response</summary>
      <pre id="raw"></pre>
    </details>
  </section>
</main>

<script>
const form = document.getElementById("form");
const token = document.getElementById("token");
const tokenError = document.getElementById("token-error");
const submit = document.getElementById("submit");
const result = document.getElementById("result");
const status = document.getElementById("status");
const links = document.getElementById("links");
const details = document.getElementById("details");
const raw = document.getElementById("raw");

function show(message, failed) {
  status.textContent = message;
  status.classList.toggle("failed", failed);
}

function setTokenRejected(rejected) {
  tokenError.hidden = !rejected;
  token.setAttribute("aria-invalid", rejected);
}

function renderLinks(urls) {
  links.replaceChildren(...urls.map((url) => {
    const item = document.createElement("li");
    if (/^https?:\/\//i.test(url)) {
      const link = document.createElement("a");
      link.href = url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = url;
      item.append(link);
    } else {
      item.textContent = url;
    }
    return item;
  }));
}

function renderBody(body) {
  const event = body.split("\n").find((line) => line.startsWith("data:"));
  const message = JSON.parse(event ? event.slice(5) : body);

  if (message.error) {
    show(message.error.message, true);
  } else if (message.result.isError) {
    show(message.result.content[0].text, true);
  } else {
    const urls = message.result.structuredContent.links ?? [];
    show(`${urls.length} ${urls.length === 1 ? "link" : "links"} found`, false);
    renderLinks(urls);
  }
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  setTokenRejected(false);
  links.replaceChildren();
  details.hidden = true;
  result.hidden = false;
  show("Scraping. This can take up to 30 seconds.", false);
  submit.disabled = true;
  submit.textContent = "Scraping";

  try {
    const response = await fetch("/mcp", {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${token.value}`,
        "Content-Type": "application/json",
        "Accept": "application/json, text/event-stream",
        "MCP-Protocol-Version": "2025-06-18",
      },
      body: JSON.stringify({
        jsonrpc: "2.0",
        id: 1,
        method: "tools/call",
        params: {
          name: "scrape_links",
          arguments: {
            url: document.getElementById("url").value,
            wait_for: document.getElementById("waitFor").value,
          },
        },
      }),
    });

    const body = await response.text();
    raw.textContent = `${response.status}\n${body}`;
    details.hidden = false;

    if (response.status === 401) {
      setTokenRejected(true);
      result.hidden = true;
      token.focus();
    } else if (response.ok) {
      renderBody(body);
    } else {
      show(`Request failed with status ${response.status}.`, true);
    }
  } catch (error) {
    show(`Request failed: ${error.message}`, true);
  } finally {
    submit.disabled = false;
    submit.textContent = "Scrape";
  }
});
</script>
</body>
</html>
